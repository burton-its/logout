<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JWT Revocation Tester</title>

<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 700px;
  margin: 40px auto;
}

textarea {
  width: 100%;
  height: 120px;
}

button {
  margin-top: 10px;
  padding: 8px 14px;
}

pre {
  background: #f4f4f4;
  padding: 12px;
}
</style>

</head>

<body>

<h2>JWT Revocation Test Console</h2>

<label>JWT Token</label>
<textarea id="tokenBox" placeholder="Paste JWT here"></textarea>

<br>

<button onclick="revokeToken()">Revoke Token</button>
<button onclick="validateToken()">Check Revocation</button>

<h3>Response</h3>
<pre id="responseBox"></pre>

<script>

function getJTI(token){
  try{
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.jti;
  }catch{
    return null;
  }
}

async function revokeToken(){

  const token = document.getElementById("tokenBox").value;

  const res = await fetch("/revoke",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({token:token})
  });

  const data = await res.json();

  document.getElementById("responseBox").textContent =
    JSON.stringify(data,null,2);
}

async function validateToken(){

  const token = document.getElementById("tokenBox").value;

  const jti = getJTI(token);

  if(!jti){
    alert("Could not extract JTI from token");
    return;
  }

  const res = await fetch(`/validate/${jti}`);

  const data = await res.json();

  document.getElementById("responseBox").textContent =
    JSON.stringify(data,null,2);
}

</script>

</body>
</html>
